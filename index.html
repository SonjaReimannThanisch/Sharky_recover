<!DOCTYPE html>
<html translate="no" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#071b2c">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
      crossorigin="anonymous"
    />
    <link rel="icon" href="./img/shark (1).png" media="(prefers-color-scheme: light)">
    <link rel="icon" href="./img/shark.png" media="(prefers-color-scheme: dark)">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="./styles/overlay.css">
    <link rel="stylesheet" href="./styles/responsive.css">
    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-objects.class.js"></script>
    <script src="./models/attack.class.js"></script>

    <script src="./levels/character-images.js"></script>
    <script src="./levels/pufferfish-images.js"></script>
    <script src="./levels/jellyfish-images.js"></script>
    <script src="./levels/bubble-images.js"></script>
    <script src="./levels/endboss-images.js"></script>

    <script src="./models/character-animation-manager.class.js"></script>
    <script src="./models/character.class.js"></script>

    <script src="./models/background-object.class.js"></script>
    <script src="./models/barriers.class.js"></script>
    <script src="./models/collider.class.js"></script>
    <script src="./models/lights.class.js"></script>

    <script src="./models/pufferfish.class.js"></script>
    <script src="./models/jellyfisch.class.js"></script>
    <script src="./models/endboss.class.js"></script>

    <script src="./models/coin.class.js"></script>
    <script src="./models/poison.class.js"></script>
    <script src="./models/status-bar.class.js"></script>

    <script src="./models/bubble-trap-attack.class.js"></script>
    <script src="./models/fin-slap-attack.class.js"></script>

    <script src="./models/keyboard.class.js"></script>
    <script src="./models/Soundmanager.class.js"></script>
    <script src="./models/gameOverScreen.class.js"></script>
    <script src="./models/win-screen.class.js"></script>
    <script src="./models/level.class.js"></script>

    <script src="./models/world-ui-manager.class.js"></script>
    <script src="./models/world-environment-manager.class.js"></script>
    <script src="./models/world-reset-manager.class.js"></script>
    <script src="./models/world-collision-manager.class.js"></script>
    <script src="./models/world-collectible-manager.class.js"></script>
    <script src="./models/combat-manager.class.js"></script>

    <script src="./levels/level1.js"></script>
    <script src="./models/world.class.js"></script>

    <script src="./scripts/gameUI.js"></script>
    <title>Sharky</title>
</head>
<body onload="init()">
    <main>
        <section class="game">
            <header>
                <h1>Sharky</h1>
            </header>
            <div id="fullscreen">
                <canvas id="backgroundCanvas" width="720" height="480"></canvas>
            </div>
            <div id="gameover" class="overlay hidden">
            <div class="banner">
                <img id="gameoverImg" src="img/6.Botones/Tittles/Game Over/Recurso 11.png" alt="Game Over">
                <div class="actions">
                <button id="btn-restart" class="btn">Try again</button>
                <button id="btn-home" class="btn btn-secondary">Home</button>
                </div>
            </div>
            </div>
            <div id="winscreen" class="overlay-win hidden">
            <div class="actions win-actions">
                <button id="btn-win-restart" class="btn">Try again</button>
                <button id="btn-win-home" class="btn btn-secondary">Home</button>
            </div>
        </div>
            <div id="impressumOverlay" class="overlay hidden">
                <div class="banner">
                    <h2>Impressum</h2>
                    <p style="color: #531a82; line-height: 1.6;">
                        Sonja Reimann-Thanisch
                        <br>
                        Irgendeine Str. 478
                        <br>
                        47888 Irgendwo
                        <br>
                        0148 / 828 82 82
                    </p>
                    <p style="color: #531a82; line-height: 1.6;">Projektarbeit – 2d Game - Sharky</p>
                    <p style="color: #531a82; line-height: 1.6;">E-Mail: irgendeine.Emailh@gmail.com</p>
                    <button class="btn close-btn" onclick="closeImpressum()">X</button>
                </div>
            </div>
            <div id="howToOverlay" class="overlay hidden">
                <div class="banner">
                    <h2>How to Play</h2>

                    <p class="howto-line" style="color: #531a82;">
                        <img src="img/1.Sharkie/4.Attack/Bubble trap/op1 (with bubble formation)/7.png" alt="Jellyfish">
                        Bubble Attack defeats Jellyfish.
                    </p>

                    <p class="howto-line" style="color: #531a82;">
                        <img src="img/1.Sharkie/4.Attack/Fin slap/7.png" alt="Pufferfish">
                        Fin Slap defeats Pufferfish.
                    </p>

                    <p class="howto-line" style="color: #531a82;">
                        <img src="img/4.Marcadores/Posión/Dark - Left.png" alt="Poison bottle">
                        Collect poison bottles to defeat the Whale Boss.
                    </p>

                    <button class="btn close-btn howto-btn" onclick="closeHowTo()">X</button>
                </div>
            </div>
            </div>
        </section>
    </main>
    <script defer src="./scripts/game.js"></script>
</body>
</html>
